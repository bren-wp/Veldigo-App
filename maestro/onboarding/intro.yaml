appId: ${APP_ID || 'com.brendigo.veldigo.dev'}
---
# First launch: screenshot-driven Veldigo welcome page (slide 1).
- launchApp:
    clearState: true
- assertVisible: "Your control."
- assertVisible: "Create a new wallet"
- assertVisible: "Import existing wallet"
# Swipe to slide 2 and slide 3, preserving the original walkthrough flow.
- swipe:
    direction: LEFT
- swipe:
    direction: LEFT
- assertVisible: "Get started"
- tapOn: "Get started"
- assertVisible: "Markets"
- assertNotVisible: "Create a new wallet"
# Intro must not reappear after completion and app restart.
- launchApp
- assertVisible: "Markets"
- assertNotVisible: "Create a new wallet"
