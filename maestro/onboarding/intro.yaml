appId: ${APP_ID || 'com.brendigo.veldigo.dev'}
---
# First launch: native Veldigo welcome (reference panel 1).
- launchApp:
    clearState: true
- assertVisible: "Your control."
- assertVisible: "Create a new wallet"
- assertVisible: "Import existing wallet"

# Second screen: security (reference panel 2).
- swipe:
    direction: LEFT
- assertVisible: "Secure"
- assertVisible: "Your assets, protected with industry-leading security."
- assertVisible: "Next"
- tapOn: "Next"

# Third screen: cryptocurrencies (reference panel 3), not premature onboarding exit.
- assertVisible: "All Your Crypto"
- assertVisible: "Manage, send, receive and swap thousands of tokens."
- assertVisible: "Next"
- assertVisible: "Skip"
- tapOn: "Next"

# Fourth screen remains in the pager until its own reference-led UI pass.
- assertVisible: "Freedom without borders"
- assertVisible: "Get started"
- tapOn: "Get started"

# Intro completion persists after relaunch.
- assertVisible: "Markets"
- assertNotVisible: "Create a new wallet"
- launchApp
- assertVisible: "Markets"
- assertNotVisible: "Secure"
