appId: ${APP_ID || 'com.brendigo.veldigo.dev'}
---
# First launch: Veldigo welcome page.
- launchApp:
    clearState: true
- assertVisible: "Your control."
- assertVisible: "Create a new wallet"
- assertVisible: "Import existing wallet"

# Second page must show native Veldigo security artwork and real navigation.
- swipe:
    direction: LEFT
- assertVisible: "Secure"
- assertVisible: "Your assets, protected with industry-leading security."
- assertVisible: "Next"
- assertVisible: "Skip"

# The Next button must navigate forward; old Next-only intro is not acceptable.
- tapOn: "Next"
- assertVisible: "All your crypto in one place"
- assertVisible: "Get started"
- tapOn: "Get started"
- assertVisible: "Markets"
- assertNotVisible: "Create a new wallet"

# Relaunch: previous introduction must not return.
- launchApp
- assertVisible: "Markets"
- assertNotVisible: "Secure"
