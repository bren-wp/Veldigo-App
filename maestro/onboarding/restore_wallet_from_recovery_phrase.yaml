appId: ${APP_ID || 'com.brendigo.veldigo.dev'}
env:
  # Public BIP39 test vector; never use a real account's recovery phrase in tests.
  MNEMONIC: "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about"
---
- launchApp:
    clearState: true
- runFlow: ../subflows/restore_wallet_from_phrase.yaml
- assertVisible: "Receive"
- assertVisible: "Send"
- assertVisible: "BTC"
- assertVisible: "ETH"
