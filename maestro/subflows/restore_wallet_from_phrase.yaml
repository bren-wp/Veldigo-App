# Restore a wallet using a public BIP39 test vector provided by the caller.
# Fresh install -> welcome -> existing gated import workflow.
appId: ${APP_ID || 'com.brendigo.veldigo.dev'}
---
- assertVisible: "Import existing wallet"
- tapOn: "Import existing wallet"
- runFlow: accept_terms.yaml
- tapOn: "from Recovery Phrase"
- tapOn: "Enter Recovery Phrase"
- inputText: ${MNEMONIC}
- hideKeyboard
- tapOn: "Next"
- tapOn: "Bitcoin"
- tapOn: "Done"
- tapOn: "Ethereum"
- tapOn: "Restore"
