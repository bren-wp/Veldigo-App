# Creates a standard wallet using the existing key-generation pipeline.
# Fresh install -> Veldigo welcome -> terms -> Create New Wallet chooser.
appId: ${APP_ID || 'com.brendigo.veldigo.dev'}
---
- assertVisible: "Create a new wallet"
- tapOn: "Create a new wallet"
- runFlow: accept_terms.yaml
- assertVisible: "Create New Wallet"
- tapOn: "Create a new wallet"
- tapOn: "Create"
