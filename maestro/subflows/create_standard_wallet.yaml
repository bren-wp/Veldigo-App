# Creates a real standard wallet and stops on its secure backup screen.
# Seed words must NEVER be logged, asserted verbatim or copied to test reports.
appId: ${APP_ID || 'com.brendigo.veldigo.dev'}
---
- assertVisible: "Create a new wallet"
- tapOn: "Create a new wallet"
- runFlow: accept_terms.yaml
- assertVisible: "Create New Wallet"
- tapOn: "Create a new wallet"
- tapOn: "Create"
- assertVisible: "Reveal recovery phrase"
