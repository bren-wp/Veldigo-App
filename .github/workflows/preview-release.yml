name: Veldigo preview APK and AAB release

on:
  push:
    branches:
      - feature/veldigo-production-ui-v02
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veldigo-preview-release
  cancel-in-progress: true

jobs:
  preview:
    if: github.repository == 'bren-wp/Veldigo-App'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Compile development APK and App Bundle
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleBaseDebug :app:bundleBaseDebug --no-daemon --stacktrace
      - name: Validate output and record hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="$(find app/build/outputs/apk/base/debug -type f -name '*.apk' | head -n 1)"
          AAB="$(find app/build/outputs/bundle -type f -name '*.aab' | head -n 1)"
          test -n "$APK" && test -s "$APK"
          test -n "$AAB" && test -s "$AAB"
          unzip -t "$APK" >/dev/null
          unzip -t "$AAB" >/dev/null
          cp "$APK" dist/VELDIGO-v0.2.0-preview.1-TEST.apk
          cp "$AAB" dist/VELDIGO-v0.2.0-preview.1-TEST.aab
          (cd dist && sha256sum ./*.apk ./*.aab > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - name: Publish explicitly non-production prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v0.2.0-preview.1
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk dist/*.aab dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/*.apk dist/*.aab dist/SHA256SUMS.txt \
              --repo "${GITHUB_REPOSITORY}" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "VELDIGO v0.2.0 preview (TEST ONLY)" \
              --notes-file docs/PREVIEW_RELEASE_NOTES.md
          fi
