name: Veldigo preview APK and AAB release

on:
  push:
    branches:
      - feature/veldigo-visual-safety-v04
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veldigo-preview-v04
  cancel-in-progress: true

jobs:
  preview:
    if: github.repository == 'bren-wp/Veldigo-App'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Verify build identification and licenses
        shell: bash
        run: |
          set -euo pipefail
          test -f licenses/Unstoppable-Wallet-MIT.txt
          grep -q 'applicationId = "com.brendigo.veldigo"' app/build.gradle.kts
          grep -q 'versionName = "0.4.0-preview.1"' app/build.gradle.kts
          if git ls-files | grep -E '\.(jks|p12|pfx)$'; then
            echo "Private release keystore may not be committed" >&2
            exit 1
          fi
          echo "TEST signing only. Not production ready."
      - name: Build Android test APK and AAB
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleBaseDebug :app:bundleBaseDebug --no-daemon --stacktrace
      - name: Validate artifacts and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="$(find app/build/outputs/apk/base/debug -type f -name '*.apk' -print -quit)"
          AAB="$(find app/build/outputs/bundle -type f -name '*.aab' -print -quit)"
          test -n "$APK" && test -s "$APK"
          test -n "$AAB" && test -s "$AAB"
          unzip -t "$APK" >/dev/null
          unzip -t "$AAB" >/dev/null
          cp "$APK" dist/VELDIGO-v0.4.0-preview.1-TEST.apk
          cp "$AAB" dist/VELDIGO-v0.4.0-preview.1-TEST.aab
          (cd dist && sha256sum *.apk *.aab > SHA256SUMS.txt)
          printf 'Commit: %s\nSigning: development/test\nProduction ready: NO\n' "$GITHUB_SHA" > dist/BUILD_INFO.txt
      - name: Publish clearly labeled test-only prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v0.4.0-preview.1
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "VELDIGO v0.4.0-preview.1 (TEST ONLY)" \
              --notes-file docs/PREVIEW_RELEASE_NOTES.md
          fi
          # Ensure GitHub marks every TEST artifact as a prerelease.
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease
