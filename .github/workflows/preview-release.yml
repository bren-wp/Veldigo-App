name: Veldigo test-only APK and AAB prerelease

on:
  push:
    branches: [main]
    paths:
      - app/build.gradle.kts
      - .github/workflows/preview-release.yml
      - docs/PREVIEW_RELEASE_NOTES.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veldigo-preview-release
  cancel-in-progress: false

jobs:
  preview:
    if: github.repository == 'bren-wp/Veldigo-Wallet'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4

      - name: Resolve preview version and skip already-published tags
        id: preview_version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$ ]]; then
            echo "Expected a uniquely versioned engineering preview" >&2
            exit 1
          fi
          TAG="v${VERSION}"
          # A push to main can update CI or documentation without changing the
          # preview version. This is a successful no-op, not a broken build.
          # Never overwrite an existing release or reuse an existing tag.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Existing $TAG: skipping duplicate preview publication."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          test -f licenses/Unstoppable-Wallet-MIT.txt
          grep -q 'applicationId = "com.brendigo.veldigo"' app/build.gradle.kts
          if git ls-files | grep -E '\.(jks|p12|pfx)$'; then
            echo "Private release signing material must not be committed" >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Block preview publication unless wallet and app tests pass
        if: steps.preview_version.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :walletkit:testDebugUnitTest :app:testBaseDebugUnitTest --no-daemon --stacktrace

      - name: Build debug/test-signed APK and AAB
        if: steps.preview_version.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleBaseDebug :app:bundleBaseDebug --no-daemon --stacktrace

      - name: Verify packages and generate SHA256SUMS
        if: steps.preview_version.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="$(find app/build/outputs/apk/base/debug -type f -name '*.apk' -print -quit)"
          AAB="$(find app/build/outputs/bundle -type f -name '*.aab' -print -quit)"
          test -n "$APK" && test -s "$APK"
          test -n "$AAB" && test -s "$AAB"
          unzip -t "$APK" >/dev/null
          unzip -t "$AAB" >/dev/null
          cp "$APK" "dist/VELDIGO-${TAG}-TEST.apk"
          cp "$AAB" "dist/VELDIGO-${TAG}-TEST.aab"
          (cd dist && sha256sum *.apk *.aab > SHA256SUMS.txt)
          printf 'Version: %s\nCommit: %s\nSigning: Android development/test key\nPackage: debug with .dev suffix\nProduction ready: NO\n' "$VERSION" "$GITHUB_SHA" > dist/BUILD_INFO.txt

      - name: Publish GitHub prerelease with both binaries
        if: steps.preview_version.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s "dist/VELDIGO-${TAG}-TEST.apk"
          test -s "dist/VELDIGO-${TAG}-TEST.aab"
          test -s dist/SHA256SUMS.txt
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "VELDIGO $VERSION (TEST ONLY)" \
            --notes-file docs/PREVIEW_RELEASE_NOTES.md
