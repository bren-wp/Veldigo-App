name: Android build verification
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veldigo-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Detect Android sources
        id: source
        run: |
          if [ -f ./gradlew ] && [ -f app/build.gradle.kts ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-java@v4
        if: steps.source.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile debug APK
        if: steps.source.outputs.present == 'true'
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleBaseDebug --no-daemon --stacktrace
      - name: Verify backup navigation does not serialize mnemonic secrets
        if: steps.source.outputs.present == 'true'
        run: |
          ./gradlew :app:testBaseDebugUnitTest --tests 'io.horizontalsystems.bankwallet.nav3.SensitiveBackupRouteSerializationTest' --no-daemon --stacktrace
      - name: Verify full recovery phrase confirmation logic
        if: steps.source.outputs.present == 'true'
        run: |
          ./gradlew :walletkit:testDebugUnitTest --tests 'io.horizontalsystems.walletkit.modules.manageaccount.backupconfirmkey.RecoveryWordVerifierTest' --no-daemon --stacktrace
      - name: Verify biometric enrollment requires OS authentication
        if: steps.source.outputs.present == 'true'
        run: |
          ./gradlew :walletkit:testDebugUnitTest --tests 'io.horizontalsystems.walletkit.modules.settings.security.setup.BiometricSetupGateTest' --no-daemon --stacktrace
      - name: Verify security setup route and PIN contract
        if: steps.source.outputs.present == 'true'
        run: |
          ./gradlew :app:testBaseDebugUnitTest --tests 'io.horizontalsystems.bankwallet.nav3.SecuritySetupRouteTest' --no-daemon --stacktrace
      - name: Verify real asset price chart input guards
        if: steps.source.outputs.present == 'true'
        run: |
          ./gradlew :walletkit:testDebugUnitTest --tests 'io.horizontalsystems.walletkit.modules.balance.token.VeldigoAssetChartRulesTest' --no-daemon --stacktrace
      - name: Verify Send Continue never bypasses form validation
        if: steps.source.outputs.present == 'true'
        run: |
          ./gradlew :walletkit:testDebugUnitTest --tests 'io.horizontalsystems.walletkit.modules.send.v2.VeldigoSendUiRulesTest' --no-daemon --stacktrace
      - name: Verify receiving never copies or shares an absent address
        if: steps.source.outputs.present == 'true'
        run: |
          ./gradlew :walletkit:testDebugUnitTest --tests 'io.horizontalsystems.walletkit.modules.receive.ui.VeldigoReceivePayloadRulesTest' --no-daemon --stacktrace
      - name: Verify wallet-only deep link admission
        if: steps.source.outputs.present == 'true'
        run: |
          ./gradlew :walletkit:testDebugUnitTest --tests 'io.horizontalsystems.walletkit.modules.main.WalletDeepLinkPolicyTest' --no-daemon --stacktrace
      - name: Compile debug AAB
        if: steps.source.outputs.present == 'true'
        run: |
          ./gradlew :app:bundleBaseDebug --no-daemon --stacktrace
      - name: Prepare test artifacts and SHA256 checksums
        if: steps.source.outputs.present == 'true' && success()
        run: |
          mkdir -p build/veldigo-test
          cp app/build/outputs/apk/base/debug/*.apk build/veldigo-test/
          cp app/build/outputs/bundle/baseDebug/*.aab build/veldigo-test/
          (cd build/veldigo-test && sha256sum ./*.apk ./*.aab > SHA256SUMS)
          printf '%s\n' 'VELDIGO Wallet — unverified engineering preview' \
            'Non-production test APK/AAB. Do not use with real assets.' \
            'Screen pixel parity, all supported chains and key custody remain unaudited.' \
            > build/veldigo-test/RELEASE_NOTES.txt
      - name: Upload test APK, AAB and SHA256SUMS
        if: steps.source.outputs.present == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: veldigo-test-apk-aab
          path: build/veldigo-test/*
          if-no-files-found: error
